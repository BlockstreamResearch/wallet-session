# Bun install policy for the live WalletConnect harness.
# References:
# - https://bun.com/docs/runtime/bunfig
# - https://bun.com/docs/pm/cli/install

[install]
auto = "disable"
exact = true
frozenLockfile = true
ignoreScripts = true
linker = "isolated"
minimumReleaseAge = 604800
saveTextLockfile = true
