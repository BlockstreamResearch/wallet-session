# Main nginx configuration for docker-compose.direct.yml (nothing in front of
# this stack): configs/nginx/nginx.conf plus a stream{} block for the front in
# edge.conf.stream-template. The image entrypoint renders *.stream-template
# files only into a stream block the main config already includes; it cannot
# add one to this read-only mount.
user  nginx;
worker_processes  auto;

# Through the front a proxied WebSocket holds four pool entries (client, front
# to unix socket, http side, relay side), all of which may sit in one worker.
# Keep worker_connections at least 4 x LIMITS__MAX_CONNECTIONS (10000 by
# default) plus headroom, and raise both values with it.
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  49152;
}

stream {
    include /etc/nginx/stream-conf.d/*.conf;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Defaults for any server block: no access log (the stock `main` format
    # writes the full request line, connection token included) and an error
    # log that withholds request lines (see default.conf.template).
    access_log off;
    error_log  /dev/stderr emerg;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
