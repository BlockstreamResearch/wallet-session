# Main nginx configuration for docker-compose.yml (a TLS terminator or load
# balancer in front of this stack). It replaces the image's stock nginx.conf to
# size the worker connection pool for the relay and to keep the stock access
# log, which records the query string, off. docker-compose.direct.yml mounts
# configs/nginx/direct/nginx.conf instead.
user  nginx;
worker_processes  auto;

# A proxied WebSocket holds two pool entries (client side and relay side), both
# of which may sit in one worker. Keep worker_connections at least
# 2 x LIMITS__MAX_CONNECTIONS (10000 by default) plus headroom, and raise both
# values with it.
worker_rlimit_nofile 32768;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  24576;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Defaults for any server block: no access log (the stock `main` format
    # writes the full request line, connection token included) and an error
    # log that withholds request lines (see default.conf.template).
    access_log off;
    error_log  /dev/stderr emerg;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
