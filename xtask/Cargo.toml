[package]
name = "xtask"
version = "0.1.0"
description = "Development harnesses for the WalletConnect client proof of concept."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "=4.6.1", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

wc-protocol = { path = "../crates/wc-protocol" }
wc-transport = { path = "../crates/wc-transport" }
