[package]
name = "wc-uniffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "UniFFI bindings for the WalletConnect single-session wallet client"
keywords = ["walletconnect", "uniffi", "android"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
getrandom = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
uniffi = "0.31.2"
wc-bitcoin = { path = "../wc-bitcoin" }
wc-core = { path = "../wc-core" }
wc-protocol = { path = "../wc-protocol" }

[dev-dependencies]
base64 = "0.22"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }

[lints]
workspace = true
