[package]
name = "wc-core"
version = "0.1.0"
description = "Core WalletConnect client primitives."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["walletconnect", "client"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
publish = false

[lints]
workspace = true

[dependencies]
# Core review objects and Verify resolver responses cross runtime boundaries
# as protocol-shaped JSON.
serde = "1"
serde_json = "1"

# Verify HTTPS uses the same Rustls/aws-lc-rs provider policy as native relay
# transport, including prefer-post-quantum.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }

thiserror = "2"

# Core runtime uses Tokio timeouts; Verify HTTPS runs through spawn_blocking so
# blocking network I/O does not stall async pairing/session flows.
tokio = { version = "1", features = ["rt", "time"] }

# Verify resolver needs a small blocking HTTPS GET client with explicit timeout,
# status-code access for missing attestations, bounded response streaming, and
# no cookies. ureq is kept on rustls-no-provider so wc-core supplies aws-lc-rs.
ureq = { version = "3.3.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

# Core state and review APIs are built from protocol DTOs and validation types.
wc-protocol = { path = "../wc-protocol" }

# The single-session runtime drives the native relay client through this crate.
wc-transport = { path = "../wc-transport" }

[dev-dependencies]
# Local runtime tests use stream/sink helpers for in-process WebSocket probes.
futures-util = "0.3"

# Unit and integration tests need Tokio macros, TCP listeners, channels, and
# simulated timeouts.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

# Core reconnect and relay-flow tests use in-process WebSocket peers.
tokio-tungstenite = "0.29"
