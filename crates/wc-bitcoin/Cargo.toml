[package]
name = "wc-bitcoin"
version = "0.1.0"
description = "WalletConnect Bitcoin chain support primitives."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["bitcoin", "walletconnect", "client"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[lints]
workspace = true

[dependencies]
# Bitcoin primitives are used behind WalletConnect-specific newtypes so wallet
# request parsing does not rely on hand-rolled address, PSBT, txid, amount, or
# derivation-path validation.
bitcoin = { version = "0.33.0-beta", default-features = false, features = ["std"] }

# Decode WalletConnect PSBT base64 with the workspace's existing base64 major,
# then pass bytes to rust-bitcoin for PSBT validation.
base64 = "0.22"

# Bitcoin WalletConnect request/result DTOs are JSON-shaped protocol values.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Public constructors expose typed validation failures.
thiserror = "2"

# Chain-specific reviews are built from generic wallet session reviews.
wc-core = { path = "../wc-core" }
wc-protocol = { path = "../wc-protocol" }
