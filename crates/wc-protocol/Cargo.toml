[package]
name = "wc-protocol"
version = "0.1.0"
description = "WalletConnect protocol DTOs, parsers, and validation primitives."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["walletconnect", "client"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
publish = false

[lints]
workspace = true

[dependencies]
# Relay Auth JWT uses unpadded base64url for the header, claims, and signature.
base64 = "0.22"

# Relay Auth JWT issuer uses did:key Ed25519 public keys encoded as base58btc.
bs58 = "0.5"

# Relay Auth JWT uses EdDSA/Ed25519 signatures.
ed25519-dalek = "2"

# WalletConnect encrypted envelopes use ChaCha20-Poly1305 with a 12-byte IV
# and 32-byte symmetric key in the maintained JavaScript implementation.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }

# Envelope encryption needs OS randomness for the 12-byte ChaCha20-Poly1305 IV.
# TODO(wasm): wasm32-unknown-unknown needs an explicit getrandom backend; decide
# whether wc-wasm owns IV generation or enables getrandom's wasm_js backend.
getrandom = "0.3"

thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pairing URI parsing follows the JavaScript implementation's URLSearchParams
# behavior without depending on a full URL parser.
form_urlencoded = "1"
