[package]
name = "wc-transport"
version = "0.1.0"
description = "Native WalletConnect relay transport."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["walletconnect", "websocket", "relay"]
categories = ["network-programming", "web-programming::websocket"]
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }

# Native relay transport uses Tokio's maintained Tungstenite integration for
# WebSocket frames. TLS roots are supplied by this crate through a custom
# Rustls connector so Android UniFFI builds do not rely on native certificate
# discovery and the workspace stays on one webpki-roots major version.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
webpki-roots = "1"

wc-protocol = { path = "../wc-protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
