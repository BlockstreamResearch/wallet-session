[package]
name = "wallet-session-relay"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "wallet-session-relay"
path = "src/main.rs"

[dependencies]
wallet-session-core = { path = "../core" }

tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
url = "2"
getrandom = "0.4"

axum = "0.8.8"
anyhow = "1"
config = "0.15.16"
tracing = "0.1"
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
thiserror.workspace = true
log = "0.4"

ed25519-dalek = "3.0.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
