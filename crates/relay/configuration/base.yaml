application:
  port: 8080
  # Peers allowed to name the client they forward in X-Real-IP, as addresses
  # or address/length ranges. Empty: the header is ignored and every
  # connection is accounted to its TCP peer. List a proxy only if it sets
  # X-Real-IP itself and nothing else can reach this port.
  trusted_proxies: []

health:
  port: 8081

auth:
  # Longest lifetime a connection token may have left when presented.
  max_token_lifetime_seconds: 600

session:
  grace_seconds: 10
  buffer_max_messages: 256
  buffer_ttl_seconds: 60

connection:
  max_incoming_frame_bytes: 262144
  handshake_timeout_seconds: 10
  write_timeout_seconds: 10
  outbound_queue_capacity: 64
  # Bytes held for one peer and not yet written: its queue and backlog, or
  # its buffer while it reconnects. At least max_incoming_frame_bytes.
  outbound_queue_max_bytes: 1048576
  # A frame not written this long after it was queued drops its slow reader.
  outbound_queue_timeout_seconds: 30
  ping_interval_seconds: 30
  pong_timeout_seconds: 10
  idle_timeout_seconds: 45

limits:
  max_connections: 10000
  max_connections_per_identity: 16
  max_sessions: 50000
  connect_rate:
    burst: 30
    interval_seconds: 60
  inbound_message_rate:
    burst: 32
    interval_seconds: 2
  inbound_byte_rate:
    burst: 524288
    interval_seconds: 2
  # Every byte read from one connection's socket: framing, control frames and
  # fragments included. Over it the socket is read more slowly, nothing is
  # dropped. Keep it above inbound_byte_rate, which counts message payloads.
  inbound_wire_byte_rate:
    burst: 1048576
    interval_seconds: 2
  identity_inbound_byte_rate:
    burst: 1048576
    interval_seconds: 1
  # Shared by every identity connecting from one address (an IPv6 /64).
  source_inbound_byte_rate:
    burst: 1048576
    interval_seconds: 1
  global_inbound_byte_rate:
    burst: 16777216
    interval_seconds: 1
  # Share of the global burst, in percent, that only frames between two
  # connected peers may spend.
  global_paired_reserve_percent: 25
