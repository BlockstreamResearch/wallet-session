name: Publish image

# Builds the relay image from master and publishes it to the staging registry
# through the shared Blockstream/ci-components publish workflow. Its build job
# runs repository code without registry credentials; its publish job runs no
# repository code, pushes only the OCI data produced by the build and signs the
# pushed digest with keyless cosign.
#
# This repository passes its own registry identity from repository variables:
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, IMAGE_NAME

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BlockstreamResearch/wallet-session'
    permissions:
      contents: read
      id-token: write
    uses: Blockstream/ci-components/.github/workflows/publish.yml@v1
    with:
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      image: ${{ vars.IMAGE_NAME }}
      environment: staging
      dockerfile: deployment/Dockerfile.relay
